<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27><text y=%27.9em%27 font-size=%2790%27>♟️</text></svg>">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gamie_oliver vs prpatel00 — game review</title>
<style>
  :root{
    --bg:#14151a; --panel:#1d1f27; --panel2:#252833; --panel3:#2d3140; --line:#333747;
    --ink:#e7e9ef; --dim:#9aa0b0; --faint:#6b7180;
    --good:#7bc86c; --bad:#e0736b; --warn:#e0946b; --accent:#e2a03f; --blue:#6ea8fe;
    --sq-light:#ebecd0; --sq-dark:#739552;
    --hl-sel:rgba(110,168,254,.55);
    --c-brill:#26c2a3; --c-great:#5c8bb0; --c-best:#81b64c; --c-exc:#95b776;
    --c-good:#96af8b; --c-book:#a88865; --c-inac:#f7c631; --c-mist:#ffa459;
    --c-miss:#ff7769; --c-blun:#fa412d;
    --graph-bg:#101116;
  }
  /* light mode: same page, calmer paper (Ben 2026-08-16: "not only dark mode") */
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f4f6; --panel:#ffffff; --panel2:#ececee; --panel3:#e0e2e8;
      --line:#d5d7de; --ink:#23252b; --dim:#5b6170; --faint:#8a8f9a;
      --graph-bg:#e8e9ec;
    }
  }
  *{box-sizing:border-box}
  html{background:var(--bg)}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  a{color:var(--blue);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:1250px;margin:0 auto;padding:16px 18px 40px}

  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  header h1{margin:0;font-size:19px;letter-spacing:.2px}
  header .score{font-size:19px;font-weight:600}
  header .sub{color:var(--dim);font-size:13px}
  .res-win{color:var(--good)} .res-loss{color:var(--bad)} .res-draw{color:var(--dim)}

  .main{display:flex;gap:16px;align-items:stretch;justify-content:center}
  @media(max-width:1040px){.main{flex-wrap:wrap}.panel{width:100% !important;max-height:none}
    .movelist{max-height:300px}}

  /* eval bar */
  .evalbar{width:26px;flex:none;border-radius:6px;overflow:hidden;
    position:relative;background:#3a3d47;box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .evalbar .white{position:absolute;left:0;right:0;background:#ebecd0;
    transition:height .5s cubic-bezier(.4,0,.2,1)}
  .evalbar .num{position:absolute;left:0;right:0;text-align:center;font-size:9.5px;
    font-weight:600;font-variant-numeric:tabular-nums;pointer-events:none}

  /* board */
  .board-col{width:min(700px,88vw,calc(100dvh - 170px));flex:none}
  .board-wrap{position:relative;width:100%;aspect-ratio:1;border-radius:6px;overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.4);user-select:none}
  .squares{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);
    grid-template-rows:repeat(8,1fr)}
  .sq{position:relative}
  .sq.l{background:var(--sq-light)} .sq.d{background:var(--sq-dark)}
  .sq::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .25s}
  .sq.hl-tint::after{background:var(--tintc,rgba(255,255,51,.5));opacity:1}
  .sq.hl-sel::after{background:var(--hl-sel);opacity:1}
  .sq.hl-key::after{opacity:1;box-shadow:inset 0 0 0 3px var(--accent);border-radius:2px}
  .sq.dot::before{content:"";position:absolute;inset:36%;border-radius:50%;
    background:rgba(0,0,0,.16);z-index:1}
  .sq.dotc::before{content:"";position:absolute;inset:4%;border-radius:50%;
    border:4px solid rgba(0,0,0,.16);background:none;box-sizing:border-box;z-index:1}
  .sq .co{position:absolute;font-size:11px;font-weight:700;color:var(--sq-dark);
    pointer-events:none;z-index:1}
  .sq .co.f{right:3px;bottom:1px} .sq .co.r{left:3px;top:1px}
  .sq.d .co{color:var(--sq-light)}
  .pieces{position:absolute;inset:0;pointer-events:none}
  .pc{position:absolute;width:12.5%;height:12.5%;touch-action:none;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.22));
    transition:transform .22s cubic-bezier(.3,.7,.4,1),opacity .3s;will-change:transform}
  .pc svg{display:block;width:100%;height:100%}
  .pc.dead{opacity:0}
  .board-wrap.retry .pc{pointer-events:auto;cursor:grab}
  .pc.drag{transition:none;z-index:5;cursor:grabbing}
  .arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .arrows line{stroke-linecap:round}
  .sqbadge{position:absolute;width:24px;height:24px;border-radius:50%;display:none;
    align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.45);z-index:3;transform:translate(-50%,-50%);
    pointer-events:none;line-height:1}

  .controls{display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
  button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:7px 13px;font-size:14px;cursor:pointer;
    touch-action:manipulation}
  button:hover{border-color:var(--faint)} button:disabled{opacity:.35;cursor:default}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
  button.small{padding:5px 10px;font-size:12.5px}
  .spacer{flex:1}

  /* ---- right panel (chess.com Game Review style) ---- */
  .panel{width:410px;flex:none;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;display:flex;flex-direction:column;overflow:hidden;
    max-height:calc(min(700px,88vw,100dvh - 170px) + 46px)}
  .paneltitle{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;
    font-weight:700;letter-spacing:.4px;color:var(--dim);border-bottom:1px solid var(--line)}
  .paneltitle .dotlogo{width:10px;height:10px;border-radius:50%;background:var(--c-best)}
  .paneltitle .right{margin-left:auto;display:flex;gap:6px}
  .paneltitle button{padding:2px 8px;font-size:12px}

  /* coach bubble */
  .coach{display:flex;gap:10px;padding:12px 14px 10px;align-items:flex-start}
  .avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--panel3);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    border:1px solid var(--line)}
  .avatar svg{width:82%;height:82%}
  .btext{flex:1;min-width:0;background:#fff;color:#23252b;border-radius:10px;
    border-top-left-radius:3px;padding:9px 12px;position:relative;min-height:56px}
  .bhead{display:flex;align-items:flex-start;gap:8px;font-weight:700;font-size:15px;
    line-height:1.3;margin-bottom:2px}
  .bhead .bico{width:17px;height:17px;border-radius:50%;flex:none;margin-top:1px;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;color:#fff}
  .bchip{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:1px 7px;
    border-radius:4px;background:#23252b;color:#fff;font-variant-numeric:tabular-nums}
  .bchip.w{background:#f0f0f0;color:#23252b;border:1px solid #ccc}
  .bbody{font-size:13.5px;line-height:1.5;color:#3a3d45;cursor:default;overflow-wrap:anywhere}
  .bbody b{color:#111}
  .bbody a{color:#2a6fb0}
  .bchips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .chip{font-size:10.5px;letter-spacing:.3px;padding:2px 8px;border-radius:20px;
    border:1px solid #d8dade;color:#6a6f7a;background:#f4f5f7}
  .chip.tag{border-color:var(--accent);color:#9a6c1a}
  .chip.rushed{border-color:var(--c-blun);color:var(--c-blun)}
  .chip.key{cursor:pointer;border-color:#c9a13d;color:#9a6c1a}
  .ref{border-bottom:1px dotted #b08a2e;cursor:pointer;font-weight:600}
  .bbody [data-uci]{cursor:pointer;border-bottom:1px dashed #999}
  .cueline{margin-top:7px;padding:6px 9px;background:#f4f0e4;border-left:3px solid var(--accent);
    border-radius:6px;font-size:12.5px;color:#6a5b30}
  .cueline b{color:#4a3f1e}
  /* long why-prose folds to 3 lines (chess.com bubbles are one-liners) */
  .clampable{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
    overflow:hidden}
  .clampable.open{display:block;-webkit-line-clamp:unset;overflow:visible}
  .morelink{color:#2a6fb0;font-size:12px;font-weight:700;cursor:pointer;
    display:inline-block;margin-top:3px;user-select:none}

  /* actions */
  .actions{display:flex;gap:7px;padding:2px 14px 12px;flex-wrap:wrap}
  .abtn{flex:1;min-width:100px;padding:9px 6px;border-radius:8px;font-weight:700;
    font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
  .abtn.green{background:var(--c-best);border-color:transparent;color:#fff}
  .abtn.green:hover{background:#8fc45e}
  .abtn.wide{flex:2.2}
  .arow2{display:flex;gap:7px;padding:0 14px 12px;flex-wrap:wrap}
  .arow2 button{font-size:12px;padding:4px 10px;color:var(--dim)}

  /* move list */
  .movelist{flex:1;overflow-y:auto;border-top:1px solid var(--line);font-size:13.5px;
    scrollbar-width:thin;min-height:90px;scroll-behavior:smooth}
  .mlrow{display:grid;grid-template-columns:32px 1fr 1fr}
  .mlrow:nth-child(odd){background:rgba(255,255,255,.025)}
  .mno{color:var(--faint);font-size:11.5px;display:flex;align-items:center;
    justify-content:flex-end;padding-right:7px;font-variant-numeric:tabular-nums}
  .half{display:flex;align-items:center;gap:5px;padding:3px 8px 3px 5px;cursor:pointer;
    position:relative;min-height:26px}
  .half:hover{background:var(--panel2)}
  .half.cur{background:var(--panel3);box-shadow:inset 0 0 0 1px #575e70}
  .half .msan{font-weight:600;white-space:nowrap}
  .badge{width:15px;height:15px;border-radius:50%;font-size:8px;font-weight:800;
    display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
  .tbar{margin-left:auto;height:4px;border-radius:2px;flex:none;opacity:.8}
  .tbar.w{background:#cfd2d8}.tbar.b{background:#666c7a}
  .varblock{grid-column:1/-1;padding:7px 10px 7px 26px;font-size:13px;line-height:2;
    background:rgba(110,168,254,.06);border-left:3px solid var(--blue)}
  .varblock.punish{border-left-color:var(--c-miss);background:rgba(250,65,45,.06)}
  .varblock .vno{color:var(--faint);font-size:11.5px;margin-right:1px}
  .vtok{padding:1px 6px;border-radius:4px;cursor:pointer;font-weight:600}
  .vtok:hover{background:var(--panel2)}
  .vtok.done{color:var(--dim);font-weight:400}
  .vtok.next{background:var(--panel3);outline:1px solid var(--line);color:var(--accent)}

  /* eval graph */
  .graph{position:relative;height:62px;border-top:1px solid var(--line);flex:none;
    overflow:hidden;cursor:pointer;background:var(--graph-bg);touch-action:none}
  .graph svg{display:block;width:100%;height:100%}
  .graph .cursorline{position:absolute;top:0;bottom:0;width:2px;background:var(--blue);
    opacity:.85;pointer-events:none;transition:left .12s}
  .gdot{position:absolute;width:8px;height:8px;border-radius:50%;transform:translate(-50%,-50%);
    pointer-events:none;border:1.5px solid rgba(0,0,0,.5)}

  /* summary */
  .summarywrap{flex:1;overflow-y:auto;padding:14px 16px;scrollbar-width:thin}
  .rescard{text-align:center;padding:2px 0 14px;border-bottom:1px solid var(--line);
    margin-bottom:12px}
  .rescard .rhead{font-size:22px;font-weight:800;letter-spacing:.2px}
  .rescard .rsub{color:var(--dim);font-size:12.5px;margin-top:3px}
  .rescard .startbtn{margin-top:12px}
  .summarywrap h3{margin:14px 0 8px;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.7px;color:var(--faint)}
  .summarywrap h3:first-child{margin-top:0}
  .accrow{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .acc{background:var(--panel2);border-radius:9px;padding:9px 8px;text-align:center}
  .acc .who{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .acc .n{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .acc.me .n{color:#fff;background:#fff;color:#23252b;border-radius:6px;display:inline-block;
    padding:0 10px;margin-top:4px}
  .acc .cap{font-size:10px;color:var(--faint);margin-top:3px}
  .clstable{display:flex;flex-direction:column;gap:2px}
  .clsrow{display:grid;grid-template-columns:1fr 34px 26px 34px;align-items:center;
    font-size:13px;padding:2.5px 4px;border-radius:6px}
  .clsrow .lbl{color:var(--dim)}
  .clsrow .cnt{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
  .clsrow .badge{margin:0 auto}
  .clsrow.z{opacity:.4}
  .story p{margin:0 0 9px;font-size:13.5px;line-height:1.6;color:var(--ink)}
  .story .pat{color:var(--dim);font-size:13px;border-top:1px solid var(--line);padding-top:8px}
  .story .pat b{color:var(--accent)}
  .story .ref{border-bottom:1px dotted var(--accent);cursor:pointer;font-weight:600;
    color:var(--ink);white-space:nowrap}
  .story .clamp{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;
    overflow:hidden}
  .story .clamp.open{display:block;-webkit-line-clamp:unset;overflow:visible}
  .story .morelink{color:var(--blue);font-size:12px;font-weight:700;cursor:pointer;
    display:inline-block;margin:2px 0 8px;user-select:none}
  .momentlist{display:flex;flex-direction:column;gap:5px}
  .mrow{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;
    background:var(--panel2);cursor:pointer;font-size:13px;border:1px solid transparent}
  .mrow:hover{border-color:var(--faint)}
  .mrow .lbl{flex:1}
  .mrow .cost{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
  .startbtn{display:flex;width:100%;margin-top:14px;padding:12px;font-size:15.5px;
    font-weight:700;background:var(--c-best);color:#fff;border:none;border-radius:9px;
    justify-content:center}
  .startbtn:hover{background:#8fc45e}
  .focusbox{margin-top:12px;background:var(--panel2);border-left:3px solid var(--accent);
    border-radius:8px;padding:10px 12px;font-size:13.5px;line-height:1.55}
  .focusbox .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--faint);display:block;margin-bottom:3px}
  .keyhints{color:var(--faint);font-size:11px;margin-top:12px;line-height:1.9}
  .veristamp{color:var(--good);font-size:11.5px;margin-top:10px;opacity:.85}
  kbd{background:var(--panel2);border:1px solid var(--line);border-radius:4px;
    padding:0 5px;font:11px/1.6 inherit;color:var(--dim)}
  /* phone: app-style layout — board pinned, panel scrolls in the remaining space */
  @media(max-width:640px){
    body{height:100dvh;overflow:hidden}
    .wrap{height:100%;display:flex;flex-direction:column;padding:6px 8px 8px}
    header{margin-bottom:6px;gap:8px;row-gap:0}
    header h1{font-size:15px} header .score{font-size:15px} header .sub{font-size:11.5px}
    .main{flex:1;min-height:0;display:grid;grid-template-columns:15px minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr);gap:6px}
    .evalbar{width:15px} .evalbar .num{font-size:7.5px}
    .board-col{width:auto;min-width:0}
    .board-wrap{width:min(100%,56dvh);margin:0 auto}
    .controls{margin-top:6px;gap:5px;flex-wrap:nowrap}
    .controls button{flex:1;padding:9px 0;font-size:14px}
    .controls .spacer{display:none}
    .panel{grid-column:1/-1;width:100%;max-height:none;min-height:0}
    /* space priority when the coach prose is long: bubble (capped, scrolls) >
       actions > graph > movelist. The movelist keeps its base min-height
       (a few rows are always visible) and the pane scrolls when even the
       minimums don't fit — nothing gets crushed to zero (issue #14). */
    .coach,.actions,.arow2{flex:none}
    #reviewpane{overflow-y:auto}
    .movelist{max-height:none;order:9}
    .coach{padding:6px 10px 5px}
    .avatar{width:36px;height:36px}
    .btext{max-height:14dvh;overflow-y:auto}
    .actions{padding:2px 10px 6px} .arow2{padding:0 10px 8px}
    .abtn{padding:10px 6px}
    .graph{height:38px}
    .summarywrap{padding:12px}
    .keyhints{display:none}
  }
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .board-wrap.shake{animation:shake .3s}
</style>
</head>

<script>
(function () {

  const FIG = { N:"♞", B:"♝", R:"♜", Q:"♛", K:"♚" };
  const MARKS = { "hang":"??", "missed-tactic":"?", "quiet-positional":"?!" };

                   "quiet-positional":"a quiet-positional mistake" };

                    "quiet-positional":"drifts in a quiet position" };

                     "quiet-positional":"var(--c-inac)" };
  const orient = D.meta.my_color;
  const momentPlies = Object.keys(D.moments).map(Number).sort((a,b)=>a-b);
  const bestPly = D.best_find ? D.best_find.ply : -1;

  // ---- fen / move helpers ---------------------------------------------------
  function parseFen(fen) {
    const map = {}; const rows = fen.split(" ")[0].split("/");
    for (let r = 0; r < 8; r++) {
      let f = 0;
      for (const ch of rows[r]) {
        if (/\d/.test(ch)) f += +ch;
        else { map[FILES[f] + (8 - r)] = ch; f++; }
      }
    }
    return map;
  }
  function applyUci(map, uci) {
    map = Object.assign({}, map);
    const from = uci.slice(0, 2), to = uci.slice(2, 4), promo = uci[4];
    let pc = map[from]; if (!pc) return map;
    const white = pc === pc.toUpperCase();
    delete map[from];
    if (pc.toLowerCase() === "p" && from[0] !== to[0] && !map[to])
      delete map[to[0] + from[1]];                          // en passant
    if (pc.toLowerCase() === "k" && Math.abs(FILES.indexOf(to[0]) - FILES.indexOf(from[0])) === 2) {
      const rank = from[1];                                  // castling: move the rook too
      if (to[0] === "g") { map["f"+rank] = map["h"+rank]; delete map["h"+rank]; }
      else { map["d"+rank] = map["a"+rank]; delete map["a"+rank]; }
    }
    if (promo) pc = white ? promo.toUpperCase() : promo.toLowerCase();
    map[to] = pc;
    return map;
  }
  function mapAt(i) { return parseFen(i < N ? D.moves[i].fen_before : D.final_fen); }
  // ---- current-position FEN (for the "open on lichess" link) ----------------
  function boardFenPart(map) {
    const rows = [];
    for (let r = 8; r >= 1; r--) {
      let row = "", empty = 0;
      for (let f = 0; f < 8; f++) {
        const pc = map[FILES[f] + r];
        if (pc) { if (empty) { row += empty; empty = 0; } row += pc; }
        else empty++;
      }
      if (empty) row += empty;
      rows.push(row);
    }
    return rows.join("/");
  }
  function currentFen() {
    if (mode === "line" && vr) {
      const turn = (vr.step % 2 === 0) ? vr.baseTurn : (vr.baseTurn === "w" ? "b" : "w");
      return boardFenPart(boardMap) + " " + turn + " - - 0 1";
    }
    if (mode === "retry" && retry) return D.moments[retry.ply].fen_before;
    return cursor < N ? D.moves[cursor].fen_before : D.final_fen;

  function sqColRow(sq) {
    const f = FILES.indexOf(sq[0]), r = +sq[1];
    return orient === "white" ? [f, 8 - r] : [7 - f, r - 1];
  }
  function winPct(cp) { return 50 + 50 * (2 / (1 + Math.exp(-0.00368 * cp)) - 1); }
  function fmtEval(cp) {
    if (cp >= 1000) return "#"; if (cp <= -1000) return "#";
    return (cp / 100).toFixed(1).replace(/^(?=\d)/, "+");
  }
  function pawns(cp) { return (cp / 100).toFixed(2).replace(/^(?=\d)/, "+"); }
  function F(san) { return san ? san.replace(/^([NBRQK])/, (_, c) => FIG[c]) : san; }

  // every move/square the coach mentions becomes a live board reference
  const SAN_RE = /\b(O-O-O|O-O|[KQRBN][a-h1-8]?x?[a-h][1-8](?:=[QRBN])?[+#]?|[a-h]x[a-h][1-8](?:=[QRBN])?[+#]?|[a-h][1-8])\b/g;
  function escT(t) { return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function linkify(text, sans) {
    if (!text) return "";
    return escT(text).replace(SAN_RE, (tok) => {
      const uci = sans && (sans[tok] || sans[tok.replace(/[+#]$/, "")]);
      if (uci) return `<span class="ref" data-uci="${uci}">${F(tok)}</span>`;
      const sq = tok.match(/[a-h][1-8](?=(?:=[QRBN])?[+#]?$)/);
      return sq ? `<span class="ref" data-sq="${sq[0]}">${F(tok)}</span>` : F(tok);
    });
  }

  // ---- per-move classification (computed from the eval track) ---------------
  // Win%-drop thresholds, chess.com-flavoured. Coach moments and the best find
  // keep their own authoritative marks; everything else is filled in here.
  const CLSDEF = {
    great:      { txt:"!",  col:"var(--c-great)", lbl:"Great find" },
    best:       { txt:"★",  col:"var(--c-best)",  lbl:"Best" },
    excellent:  { txt:"✓",  col:"var(--c-exc)",   lbl:"Excellent" },
    good:       { txt:"✓",  col:"var(--c-good)",  lbl:"Good" },
    book:       { txt:"≡",  col:"var(--c-book)",  lbl:"Book" },
    inaccuracy: { txt:"?!", col:"var(--c-inac)",  lbl:"Inaccuracy" },
    mistake:    { txt:"?",  col:"var(--c-mist)",  lbl:"Mistake" },
    blunder:    { txt:"??", col:"var(--c-blun)",  lbl:"Blunder" },
  };
  const CLS = new Array(N + 1).fill(null);    // ply -> class key
  const DROP = new Array(N + 1).fill(0);      // ply -> win% drop for the mover
  (function classify() {
    for (let i = 0; i < N; i++) {
      const white = D.moves[i].side === "white";
      const wb = white ? winPct(D.evals[i]) : 100 - winPct(D.evals[i]);
      const wa = white ? winPct(D.evals[i+1]) : 100 - winPct(D.evals[i+1]);
      const drop = Math.max(0, wb - wa);
      DROP[i+1] = drop;
      let k;
      if (i < 10 && drop < 1.2) k = "book";
      else if (drop < 2) k = "best";
      else if (drop < 5) k = "excellent";
      else if (drop < 12) k = "good";
      else if (drop < 20) k = "inaccuracy";
      else if (drop < 30) k = "mistake";
      else k = "blunder";
      CLS[i+1] = k;
    }
  })();
  // chess.com-style: EVERY move carries its classification badge (board +
  // move list), coach moments and the best find keep their own marks
  function badgeFor(ply) {
    const m = D.moments[ply];
    if (m) return { txt: MARKS[m.category], col: BADGECOL[m.category] };
    if (ply === bestPly) return CLSDEF.great;
    const k = CLS[ply];
    return k ? CLSDEF[k] : null;
  }
  function accuracy(mine) {                   // CAPS2-style estimate per player:
    let s = 0, hs = 0, n = 0;                 // mean/harmonic blend so blunders bite
    for (let p = 1; p <= N; p++) {
      if (!!D.moves[p-1].mine !== mine) continue;
      const a = Math.max(1, Math.min(100, 103.1668 * Math.exp(-0.04354 * DROP[p]) - 3.1669));
      s += a; hs += 1 / a; n++;
    }
    return n ? ((s / n + n / hs) / 2).toFixed(1) : "—";
  }

  // localStorage can be walled off (sandboxed iframes, in-app webviews)
  function store(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }

  let muted = store("chesscoach.muted") !== "0";   // default OFF — opt in via 🔊
  let actx = null;
  function ac() { if (!actx) try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} return actx; }
  function blip(freq, t0, dur, gain, type) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .02);
  }
  const snd = {   // softened 2026-08-16 — lower gain, shorter tail
    move()    { if (!muted) { blip(300, 0, .06, .07, "triangle"); blip(170, 0, .08, .06); } },
    capture() { if (!muted) { blip(220, 0, .08, .09, "square"); blip(120, 0, .1, .08); } },
    alert()   { if (!muted) { blip(220, 0, .1, .06); blip(150, .09, .14, .07); } },
    yay()     { if (!muted) { blip(520, 0, .07, .06); blip(780, .08, .1, .06); } },
  };
  const bSound = document.getElementById("b-sound");
  function syncSound() { bSound.textContent = muted ? "🔇" : "🔊"; }
  bSound.onclick = () => { muted = !muted; storeSet("chesscoach.muted", muted ? "1" : "0"); syncSound(); };
  syncSound();

  // ---- board: static squares + animated piece layer -------------------------
  const sqEls = {};
  (function buildSquares() {
    const host = document.getElementById("squares");
    for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) {
      const file = orient === "white" ? col : 7 - col;
      const rank = orient === "white" ? 8 - row : row + 1;
      const name = FILES[file] + rank;
      const el = document.createElement("div");
      el.className = "sq " + ((file + rank) % 2 === 0 ? "l" : "d");
      el.dataset.sq = name;
      if (col === 0) { const c = document.createElement("span"); c.className = "co r"; c.textContent = rank; el.appendChild(c); }
      if (row === 7) { const c = document.createElement("span"); c.className = "co f"; c.textContent = FILES[file]; el.appendChild(c); }
      el.addEventListener("click", () => onSquareClick(name));
      host.appendChild(el); sqEls[name] = el;
    }
  })();

  const piecesHost = document.getElementById("pieces");
  let pieceEls = {};
  let boardMap = {};
  function place(el, sq) {
    const [c, r] = sqColRow(sq);
    el.style.transform = `translate(${c * 100}%, ${r * 100}%)`;
  }
  function pieceSvg(pc) {
    const id = (pc === pc.toUpperCase() ? "w" : "b") + pc.toUpperCase();
    return `<svg><use href="#pc-${id}"/></svg>`;
  }
  function mkPiece(pc, sq) {
    const el = document.createElement("span");
    el.className = "pc " + (pc === pc.toUpperCase() ? "w" : "b");
    el.innerHTML = pieceSvg(pc);
    place(el, sq);
    piecesHost.appendChild(el);
    return el;
  }
  function setBoard(map) {
    piecesHost.innerHTML = ""; pieceEls = {};
    for (const sq in map) pieceEls[sq] = mkPiece(map[sq], sq);
    boardMap = map;
  }
  function fadeOut(el) {
    if (!el) return;
    el.classList.add("dead");
    setTimeout(() => el.remove(), 320);
  }
  function isCapture(uci) {
    const from = uci.slice(0,2), to = uci.slice(2,4);
    const pc = boardMap[from];
    return !!boardMap[to] || (pc && pc.toLowerCase() === "p" && from[0] !== to[0]);
  }
  function animateMove(uci, silent) {
    const from = uci.slice(0, 2), to = uci.slice(2, 4), promo = uci[4];
    const pc = boardMap[from]; if (!pc) { setBoard(applyUci(boardMap, uci)); return; }
    if (!silent) (isCapture(uci) ? snd.capture : snd.move)();
    const white = pc === pc.toUpperCase();
    if (pc.toLowerCase() === "p" && from[0] !== to[0] && !boardMap[to]) {
      fadeOut(pieceEls[to[0] + from[1]]); delete pieceEls[to[0] + from[1]];
    }
    if (pieceEls[to]) fadeOut(pieceEls[to]);
    if (pc.toLowerCase() === "k" && Math.abs(FILES.indexOf(to[0]) - FILES.indexOf(from[0])) === 2) {
      const rank = from[1];
      const rf = to[0] === "g" ? "h"+rank : "a"+rank, rt = to[0] === "g" ? "f"+rank : "d"+rank;
      const rook = pieceEls[rf];
      if (rook) { place(rook, rt); pieceEls[rt] = rook; delete pieceEls[rf]; }
    }
    const el = pieceEls[from];
    place(el, to);
    pieceEls[to] = el; delete pieceEls[from];
    if (promo) setTimeout(() => {
      el.innerHTML = pieceSvg(white ? promo.toUpperCase() : promo.toLowerCase());
    }, 200);
    boardMap = applyUci(boardMap, uci);
  }
  function animateUnmove(uci, mapBefore) {
    const from = uci.slice(0, 2), to = uci.slice(2, 4), promo = uci[4];
    const el = pieceEls[to];
    if (!el) { setBoard(mapBefore); return; }
    snd.move();
    if (promo) el.innerHTML = pieceSvg(mapBefore[from]);
    place(el, from);
    pieceEls[from] = el; delete pieceEls[to];
    const pc = mapBefore[from];
    if (pc && pc.toLowerCase() === "k" && Math.abs(FILES.indexOf(to[0]) - FILES.indexOf(from[0])) === 2) {
      const rank = from[1];
      const rf = to[0] === "g" ? "f"+rank : "d"+rank, rt = to[0] === "g" ? "h"+rank : "a"+rank;
      const rook = pieceEls[rf];
      if (rook) { place(rook, rt); pieceEls[rt] = rook; delete pieceEls[rf]; }
    }
    for (const sq in mapBefore)

    boardMap = mapBefore;
  }
  function highlight(spec) {                 // {sq: color|"sel"|"key"}
    for (const sq in sqEls) {

      sqEls[sq].style.removeProperty("--tintc");

    for (const sq in (spec || {})) {

  }
  const ARROWCOL = { g:"#7bc86c", b:"#6ea8fe", r:"#e0736b", y:"#e2a03f" };
  function drawArrows(specs) {               // [{uci, col}] — chess.com-style:
    const g = document.getElementById("arrowg");   // thick, rounded, knight bends
    g.innerHTML = "";
    for (const s of (specs || [])) {
      if (!s.uci) continue;
      const [c1, r1] = sqColRow(s.uci.slice(0, 2)), [c2, r2] = sqColRow(s.uci.slice(2, 4));
      const dx = c2 - c1, dy = r2 - r1;
      const pts = [[c1 + .5, r1 + .5]];
      if ((Math.abs(dx) === 2 && Math.abs(dy) === 1) ||

      const prev = pts[pts.length - 1];

      pts.push([c2 + .5 - ddx / len * .3, r2 + .5 - ddy / len * .3]);
      const d0x = pts[1][0] - pts[0][0], d0y = pts[1][1] - pts[0][1], l0 = Math.hypot(d0x, d0y) || 1;
      pts[0] = [pts[0][0] + d0x / l0 * .18, pts[0][1] + d0y / l0 * .18];
      const el = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
      el.setAttribute("points", pts.map(p => p[0].toFixed(3) + "," + p[1].toFixed(3)).join(" "));
      el.setAttribute("fill", "none");
      el.setAttribute("stroke", ARROWCOL[s.col] || ARROWCOL.b);
      el.setAttribute("stroke-width", ".16");
      el.setAttribute("stroke-linecap", "round");
      el.setAttribute("stroke-linejoin", "round");
      el.setAttribute("opacity", ".85");
      el.setAttribute("marker-end", `url(#ah-${s.col in ARROWCOL ? s.col : "b"})`);
      g.appendChild(el);
      if (s.label) {                         // the WHY of the arrow, on the arrow
        const p1 = pts[0], p2 = pts[pts.length - 1];
        const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
        t.setAttribute("x", ((p1[0] + p2[0]) / 2).toFixed(3));
        t.setAttribute("y", ((p1[1] + p2[1]) / 2 - .14).toFixed(3));
        t.setAttribute("text-anchor", "middle");
        t.setAttribute("font-size", ".28");
        t.setAttribute("font-weight", "700");
        t.setAttribute("fill", "#fff");
        t.setAttribute("stroke", "rgba(0,0,0,.65)");
        t.setAttribute("stroke-width", ".07");
        t.setAttribute("paint-order", "stroke");
        let lbl = s.label;
        if (lbl.length > 26)                 // cut on a word, not mid-"pawn"

      }

  }
  function drawArrow(uci, color) { drawArrows(uci ? [{ uci, col: color }] : []); }
  function cssColor(v) {                     // resolve var(--x) for inline use

  function setBadge(sq, text, color) {

  // ---- state ----------------------------------------------------------------
  let cursor = 0;
  let mode = "summary";                      // summary | game | line | retry
  let vr = null;                             // {ply, pv, sans, notes, step, base, maps, kind, col}
  let retry = null;
  let playing = null;
  function momentAt(i) { return D.moments[i] || null; }

  function restoreDecor() {
    if (mode === "line" && vr) {
      setBadge(null);
      const last = vr.step > 0 ? vr.pv[vr.step - 1] : null;
      highlight(last ? { [last.slice(0,2)]:"sel", [last.slice(2,4)]:"sel" } : {});
      drawArrow(null);   // no upcoming-move arrow: stepping the line IS the reveal
    } else if (mode === "retry") {
      setBadge(null);

    } else {
      const spec = {};
      const m = momentAt(cursor);
      const bdg = cursor > 0 ? badgeFor(cursor) : null;
      if (cursor > 0) {
        const mv = D.moves[cursor - 1];
        const tint = bdg ? tintOf(bdg.col) : "rgba(255,255,51,.5)";
        spec[mv.uci.slice(0, 2)] = tint; spec[mv.uci.slice(2, 4)] = tint;

  }

  // ---- eval bar + graph -----------------------------------------------------
  function setEvalBar(i) { setEvalBarCp(D.evals[i]); }
  function setEvalBarCp(cp) {
    if (cp == null) return;
    const w = document.getElementById("evwhite");
    const pct = Math.max(4, Math.min(96, winPct(cp)));
    if (orient === "white") { w.style.bottom = 0; w.style.top = "auto"; }
    else { w.style.top = 0; w.style.bottom = "auto"; }

    const whiteLeads = cp >= 0;

  }
  (function buildGraph() {
    const g = document.getElementById("graph");
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", `0 0 ${N} 100`);
    svg.setAttribute("preserveAspectRatio", "none");
    let dPath = `M0,100 `;
    for (let i = 0; i <= N; i++) dPath += `L${i},${100 - winPct(D.evals[i])} `;
    dPath += `L${N},100 Z`;
    const area = document.createElementNS("http://www.w3.org/2000/svg", "path");
    area.setAttribute("d", dPath); area.setAttribute("fill", "#ebecd0");

    }

  })();

  // ---- move list ------------------------------------------------------------
  const mlHost = document.getElementById("movelist");
  const maxSec = Math.max(1, ...D.moves.map(m => m.sec || 0));
  function halfCell(i) {                     // i = move index (0-based)
    const mv = D.moves[i], ply = i + 1;
    const cell = document.createElement("div");
    cell.className = "half"; cell.dataset.ply = ply;
    const bdg = badgeFor(ply);
    if (bdg) {

  (function buildMoveList() {

  function momentChips(m) {

  // ---- actions row ----------------------------------------------------------
  function actions(list, small) {
    const host = document.getElementById(small ? "arow2" : "actions");
    host.innerHTML = "";
    for (const a of (list || [])) {
      const b = document.createElement("button");
      if (!small) b.className = "abtn" + (a.cls ? " " + a.cls : "");
      else b.className = "small";
      b.innerHTML = a.label;
      b.onclick = a.fn;
      host.appendChild(b);
    }
  }

  // ---- panel rendering per state --------------------------------------------
  function nextMomentLabel() {
    const stops = momentPlies.concat(bestPly > 0 ? [bestPly] : []).sort((a,b)=>a-b);
    const nxt = stops.find(p => p > cursor);
    return nxt != null ? "Next" : "Finish";
  }
  function momentProgress() {                // "moment k of M" wayfinding
    const stops = momentPlies.concat(bestPly > 0 ? [bestPly] : []).sort((a,b)=>a-b);
    if (!stops.length) return "";
    const k = stops.filter(p => p <= cursor).length;
    return k > 0 ? `moment ${k} of ${stops.length}` : `${stops.length} moments`;
  }
  function renderPanel() {
    const sm = document.getElementById("summary");
    const rp = document.getElementById("reviewpane");
    document.getElementById("ptprog").textContent =
      mode === "summary" ? "" : momentProgress();
    if (mode === "summary") { sm.style.display = "block"; rp.style.display = "none"; renderSummary(); return; }
    sm.style.display = "none"; rp.style.display = "flex";
    renderVar();

    if (mode === "line") {
      const isEnd = vr.step >= vr.pv.length;
      if (vr.step === 0) {
        const m = vr.ply > 0 && D.moments[vr.ply];
        bubble({
          head: vr.kind === "punish" ? `Why ${F(m ? m.san : "")} fails` : "The better plan",
          chip: vr.evals ? vr.evals[0] : null,
          body: vr.kind === "punish"
            ? "Step through the punishment — this is what was hanging over the move."
            : (m && m.better_plan ? `<b>${m.better_plan}</b> — step through the line.` : "Step through the line."),
        });
      } else {
        const i = vr.step - 1;
        const note = (vr.notes || [])[i] || "";
        const msans = (D.moments[vr.ply] || {}).sans;
        bubble({
          head: `${vr.step}. ${F(vr.sans[i])}`,
          chip: vr.evals ? vr.evals[vr.step] : null,
          ico: vr.kind === "punish" ? { txt:"!", col:"var(--c-miss)" } : { txt:"★", col:"var(--c-best)" },
          body: note ? linkify(note, msans) : (isEnd ? "End of the line." : "…and the line continues."),
        });
      }
      const m = vr.ply > 0 && D.moments[vr.ply];
      actions([
        { label:"‹", fn:() => lineStep(-1) },
        // at line end, keep the flow moving: primary goes straight on
        isEnd ? { label:nextMomentLabel() === "Finish" ? "Finish →" : "Next moment →",
                  cls:"green wide", fn:() => { exitSub(); nextMoment(); } }
              : { label:"Next ›", cls:"green wide", fn:() => lineStep(1) },
        { label:"✓ Got it", fn:exitSub },
      ]);
      actions(vr.kind === "punish" && m
        ? [{ label:"▶ play the better plan instead", fn:() => { mode = "game"; enterLine(); } }]
        : (vr.kind === "best" && m && (m.punish_pv_uci || []).length
          ? [{ label:`⚔ see why ${F(m.san)} fails`, fn:() => { mode = "game"; enterPunish(); } }] : []), true);
      return;
    }

    if (mode === "retry") {
      const m = D.moments[retry.ply];
      bubble({
        head: "Your move — find the better one",
        body: retry.msg || `You played <b>${F(m.san)}</b> here. Drag a piece (or click it for its legal moves) and try the coach's move.`,
      });
      actions([
        { label:"💡 Show me", fn:retryReveal },
        { label:"↩ Back", fn:exitSub },
      ]);
      actions([], true);
      return;
    }

    // ---- plain game states --------------------------------------------------
    const m = momentAt(cursor);
    if (cursor === 0) {
      bubble({ head:"The start",
        body:`Step through with <b>→</b>, or jump straight to the first key moment.
          <div style="margin-top:7px;font-size:12px;color:#6a6f7a;line-height:1.6">
          Arrows: <b style="color:#5a9744">green</b> = engine best ·
          <b style="color:#b58a2e">yellow</b> = the idea ·
          <b style="color:#c05a50">red</b> = the punishment.<br>
          Underlined moves &amp; squares are live — hover or tap to see them on the board.
          <kbd style="background:#eee;border:1px solid #ccc;color:#555">Space</kbd> shows the best move anywhere.</div>`,
      });
      actions([{ label:"Next →", cls:"green", fn:nextMoment }]);
      actions([], true);
    } else if (m) {
      const firstStop = cursor === Math.min(...momentPlies.concat(bestPly > 0 ? [bestPly] : []));
      const legend = firstStop ? `<div style="margin-top:7px;font-size:11.5px;color:#8a8f99;line-height:1.55">
        <b style="color:#5a9744">green</b> = best move · <b style="color:#b58a2e">yellow</b> = the idea ·
        underlined text is live on the board · <b>Space</b> = best move anywhere</div>` : "";
      bubble({
        ico: { txt: MARKS[m.category], col: BADGECOL[m.category] },
        head: `${F(m.san)} ${CATHEAD[m.category]}`,
        chip: D.evals[cursor],
        body: `<div class="clampable">` +
          (m.why ? linkify(m.why, m.sans) : `The engine preferred <b data-uci="${m.best_uci}" data-col="g">${F(m.best_san)}</b> — ${(m.cpl/100).toFixed(1)} pawns better.`) +
          (m.why ? ` <b>Better was <span data-uci="${m.best_uci}" data-col="g">${F(m.best_san)}</span>.</b>` : "") +
          `</div>` +
          (m.cue ? `<div class="cueline">Ask yourself: <b>${linkify(m.cue, m.sans)}</b></div>` : "") +
          legend,
        chips: momentChips(m),
      });
      actions([
        { label:"★ Best", fn:() => { enterLine(); lineStep(1); } },
        { label:"💡 Explain", cls:"green", fn:() => enterLine() },
        { label:`${nextMomentLabel()} →`, fn:nextMoment },
      ]);
      actions([
        { label:"🎯 find it yourself", fn:enterRetry },
        ...((m.punish_pv_uci || []).length ? [{ label:`⚔ why ${F(m.san)} fails`, fn:enterPunish }] : []),
      ], true);
    } else if (cursor === bestPly) {
      const bf = D.best_find;
      bubble({
        ico: CLSDEF.great,
        head: `${F(bf.san)}! — your best find`,
        chip: D.evals[cursor],
        body: D.good_move_note || `The engine's uniquely best move — the next-best option was ${(bf.gap/100).toFixed(1)} pawns worse.`,
      });
      actions([
        { label:"💡 See why it works", cls:"green", fn:() => enterLine() },
        { label:`${nextMomentLabel()} →`, fn:nextMoment },
      ]);
      actions([], true);
    } else if (cursor === N) {
      const meta = D.meta;
      const res = meta.outcome === "win" ? "You won" : meta.outcome === "loss" ? "You lost" : "Draw";
      const cues = momentPlies.map(p => D.moments[p].cue).filter(Boolean);
      bubble({
        head: `${res} · ${meta.termination}`,
        body: (D.focus ? `<b>Focus for next game:</b> ${D.focus}` : "") +
          (cues.length ? `<div class="cueline" style="margin-top:8px">This game's questions:` +
            cues.map(c => `<div>· <b>${c}</b></div>`).join("") + `</div>` : "") +
          (D.pattern_note ? `<div style="margin-top:6px;color:#6a6f7a">${D.pattern_note}</div>` : ""),
      });
      actions([{ label:"⌂ Back to summary", fn:() => { mode = "summary"; renderPanel(); } }]);
      actions([{ label:`view on chess.com ↗`, fn:() => {
        // window.open is blocked in sandboxed webviews (artifact, srcdoc iframes)
        const a = document.createElement("a");
        a.href = meta.url; a.target = "_blank"; a.rel = "noopener";
        document.body.appendChild(a); a.click(); a.remove();
      } }], true);
    } else {
      const mv = D.moves[cursor - 1];
      const who = mv.mine ? "You" : D.meta.opp;
      const bdg = badgeFor(cursor);
      const k = CLS[cursor];
      bubble({
        ico: bdg || (k ? CLSDEF[k] : null),
        head: `${mv.movno}${mv.side === "black" ? "…" : "."} ${F(mv.san)}`,
        chip: D.evals[cursor],
        body: `${who} · ${CLSDEF[k] ? CLSDEF[k].lbl.toLowerCase() : ""}${mv.sec != null ? ` · ${Math.round(mv.sec)}s` : ""}`,
      });
      actions([{ label:`${nextMomentLabel()} →`, cls:"green", fn:nextMoment }]);
      actions([], true);
    }
  }

  // ---- summary --------------------------------------------------------------
  // "37...d4" in the story becomes a click-to-jump ref: the board goes there.
  // (Ben 2026-08-16: the prose is useful but the notation in it was dead text.)
  const PLYOF = {};
  for (let i = 0; i < N; i++) {
    const mv = D.moves[i];
    PLYOF[mv.movno + (mv.side === "white" ? "." : "...") +
          mv.san.replace(/[+#]$/, "")] = i + 1;
  }
  function linkifyStory(text) {
    if (!text) return "";
    return text.replace(
      /(\d+)(\.{3}|…\s?|\.)\s?(O-O-O|O-O|[KQRBN]?[a-h]?[1-8]?x?[a-h][1-8](?:=[QRBN])?[+#]?)/g,
      (all, no, dots, san) => {
        const w = dots === ".";
        const ply = PLYOF[no + (w ? "." : "...") + san.replace(/[+#]$/, "")];
        return ply ? `<span class="ref" data-ply="${ply}">${no}${w ? "." : "…"}${F(san)}</span>` : all;
      });
  }
  function clsCounts() {
    const rows = ["great","best","excellent","good","book","inaccuracy","mistake","blunder"];
    const cnt = { me:{}, opp:{} };
    for (const r of rows) { cnt.me[r] = 0; cnt.opp[r] = 0; }
    for (let p = 1; p <= N; p++) {
      const side = D.moves[p-1].mine ? "me" : "opp";
      const m = D.moments[p];
      let k = CLS[p];
      if (m) k = { "hang":"blunder", "missed-tactic":"mistake", "quiet-positional":"inaccuracy" }[m.category];
      if (p === bestPly) k = "great";
      cnt[side][k]++;
    }
    return { rows, cnt };
  }
  // (repertoire panel removed for portfolio)

  function renderSummary() {
    const meta = D.meta;
    const { rows, cnt } = clsCounts();
    const accMe = accuracy(true), accOpp = accuracy(false);
    const meName = `${meta.user}`, oppName = `${meta.opp}`;
    const clsRows = rows.map(r => {
      const d = CLSDEF[r];
      const z = !cnt.me[r] && !cnt.opp[r];
      return `<div class="clsrow${z ? " z" : ""}">
        <span class="lbl">${d.lbl}</span>
        <span class="cnt" style="color:${cssColor(d.col)}">${cnt.me[r]}</span>
        <span class="badge" style="background:${cssColor(d.col)};color:${d.col === "var(--c-inac)" ? "#5b4d00" : "#fff"}">${d.txt}</span>
        <span class="cnt" style="color:${cssColor(d.col)}">${cnt.opp[r]}</span>
      </div>`;
    }).join("");
    const nQuiet = momentPlies.filter(p => D.moments[p].category === "quiet-positional").length;
    const moments = momentPlies.map(p => {
      const m = D.moments[p];
      return `<div class="mrow" data-goto="${p}">
        <span class="badge" style="background:${cssColor(BADGECOL[m.category])};color:${m.category === "quiet-positional" ? "#5b4d00" : "#fff"}">${MARKS[m.category]}</span>
        <span class="lbl">Move ${m.movno} · <b>${F(m.san)}</b> <span style="color:var(--faint)">${m.tag && m.tag !== m.category ? "· " + m.tag : ""}</span></span>
        <span class="cost">−${(m.cpl/100).toFixed(1)}</span></div>`;
    }).join("") + (bestPly > 0 ? `<div class="mrow" data-goto="${bestPly}">
        <span class="badge" style="background:${cssColor(CLSDEF.great.col)}">!</span>
        <span class="lbl">Move ${D.best_find.movno} · <b>${F(D.best_find.san)}</b> <span style="color:var(--faint)">· your best find</span></span></div>` : "");
    const res = meta.outcome === "win" ? "You won" : meta.outcome === "loss" ? "You lost" : "Draw";
    const resCls = meta.outcome === "win" ? "res-win" : meta.outcome === "loss" ? "res-loss" : "res-draw";
    const alexHtml = "";
    document.getElementById("summary").innerHTML = `
      <div class="rescard">
        <div class="rhead ${resCls}">${res}${meta.outcome === "win" ? " 🏆" : ""}</div>
        <div class="rsub">by ${meta.termination} · ${meta.time_class} ${meta.time_control} ·
          ${meta.user} (${meta.my_rating}) vs ${meta.opp} (${meta.opp_rating})</div>
        <button class="startbtn" id="b-start">★ Start Review</button>
      </div>
      <h3>Accuracy <span style="float:right;color:var(--faint);text-transform:none;letter-spacing:0">est. from ${N} evals</span></h3>
      <div class="accrow">
        <div class="acc me"><div class="who">${meName}</div><div class="n">${accMe}</div><div class="cap">avg CP loss ${meta.avg_cpl}</div></div>
        <div class="acc"><div class="who">${oppName}</div><div class="n">${accOpp}</div><div class="cap">&nbsp;</div></div>
      </div>
      <h3>Move quality</h3>
      <div class="clstable">${clsRows}</div>
      ${D.narrative ? `<h3>The story of the game</h3><div class="story"><p class="clamp">${linkifyStory(D.narrative)}</p>
        ${D.pattern_note ? `<div class="pat"><b>Pattern check:</b> ${linkifyStory(D.pattern_note)}</div>` : ""}</div>` : ""}
      ${alexHtml}
      <h3>Key moments <span style="float:right;color:var(--faint);text-transform:none;letter-spacing:0">${nQuiet} quiet mistake${nQuiet === 1 ? "" : "s"}</span></h3>
      <div class="momentlist">${moments || `<span style="color:var(--faint);font-size:13px">None found — clean game.</span>`}</div>
      ${D.focus ? `<div class="focusbox"><span class="k">Focus for the next game</span>${D.focus}</div>` : ""}
      ${D.validation ? `<div class="veristamp">✓ ${D.validation.checks} coach claims machine-checked against Stockfish${D.validation.flags && D.validation.flags.length ? ` · ${D.validation.flags.length} could not be verified` : ""}</div>` : ""}
      <div class="keyhints"><kbd>←</kbd><kbd>→</kbd> step · <kbd>↑</kbd> start · <kbd>↓</kbd> end ·
        <kbd>N</kbd> next moment · <kbd>Space</kbd> best move · <kbd>P</kbd> autoplay · <kbd>Esc</kbd> back</div>`;
    const sm2 = document.getElementById("summary");
    sm2.querySelectorAll("[data-goto]").forEach(el =>
      el.addEventListener("click", () => { mode = "game"; goTo(+el.dataset.goto, "force"); }));
    sm2.querySelectorAll(".story [data-ply]").forEach(el =>
      el.addEventListener("click", () => { mode = "game"; goTo(+el.dataset.ply, "force"); }));
    const cl = sm2.querySelector(".story .clamp");
    if (cl && cl.scrollHeight > cl.clientHeight + 3) {
      const more = document.createElement("span");
      more.className = "morelink"; more.textContent = "read the full story ▾";
      more.onclick = () =>
        more.textContent = cl.classList.toggle("open") ? "fold it up ▴" : "read the full story ▾";
      cl.after(more);
    }
    document.getElementById("b-start").onclick = () => { mode = "game"; goTo(0, "force"); nextMoment(); };
  }

  // ---- game navigation ------------------------------------------------------
  function goTo(i, opt) {
    i = Math.max(0, Math.min(N, i));
    let force = opt === "force";
    if (mode === "line" || mode === "retry") { vr = null; retry = null; clearVar(); force = true; }
    if (mode !== "game") mode = "game";
    if (!force && i === cursor + 1) animateMove(D.moves[cursor].uci);
    else if (!force && i === cursor - 1) animateUnmove(D.moves[cursor - 1].uci, mapAt(cursor - 1));
    else if (force || i !== cursor) setBoard(mapAt(i));
    const arrived = i !== cursor;
    cursor = i;
    restoreDecor();
    setEvalBar(cursor);
    document.getElementById("gcursor").style.left = (cursor / N * 100) + "%";
    renderPanel();
    syncMoveList();
    if (arrived && momentAt(cursor)) snd.alert();
    else if (arrived && cursor === bestPly) snd.yay();
    if (playing && (momentAt(cursor) || cursor === bestPly || cursor >= N)) stopPlay();
  }
  function step(d) {
    if (mode === "line") { lineStep(d); return; }
    if (mode === "retry") return;
    if (mode === "summary") { mode = "game"; goTo(0, "force"); return; }
    goTo(cursor + d);
  }
  function nextMoment() {
    const stops = momentPlies.concat(bestPly > 0 ? [bestPly] : []).sort((a,b)=>a-b);
    const nxt = stops.find(p => p > cursor);
    goTo(nxt != null ? nxt : N);
  }
  function startPlay() {
    stopPlay();
    if (mode !== "game") return;
    playing = setInterval(() => { if (cursor >= N) stopPlay(); else step(1); }, 1700);
    document.getElementById("b-play").textContent = "⏸ Pause";
  }
  function stopPlay() {
    if (playing) clearInterval(playing);
    playing = null;
    document.getElementById("b-play").textContent = "▶ Play";
  }

  // ---- engine-line mode -----------------------------------------------------
  function enterLine() {
    stopPlay();
    const src = momentAt(cursor) || (cursor === bestPly ? D.best_find : null);
    if (!src) return;
    const base = parseFen(src.fen_before);
    vr = { ply: momentAt(cursor) ? cursor : bestPly, pv: src.pv_uci,
           sans: src.pv_san.split(" "), evals: src.pv_evals || null,
           notes: src.best_line_notes || [], col: "g", kind: "best",
           step: 0, base: base, maps: [base], baseTurn: src.fen_before.split(" ")[1] };
    mode = "line"; retry = null;
    setBoard(base);
    restoreDecor();
    setEvalBarCp(vr.evals ? vr.evals[0] : D.evals[vr.ply]);
    renderPanel();
  }
  function enterPunish() {
    stopPlay();
    const m = momentAt(cursor);
    if (!m || !(m.punish_pv_uci || []).length) return;
    const base = mapAt(cursor);
    vr = { ply: cursor, pv: m.punish_pv_uci, sans: m.punish_pv_san.split(" "),
           evals: m.punish_evals || null,
           notes: m.punish_line_notes || [], col: "r", kind: "punish",
           step: 0, base: base, maps: [base],
           baseTurn: (cursor < N ? D.moves[cursor].fen_before : D.final_fen).split(" ")[1] };
    mode = "line"; retry = null;
    setBoard(base);
    restoreDecor();
    setEvalBarCp(vr.evals ? vr.evals[0] : D.evals[vr.ply]);
    renderPanel();
  }
  function lineStep(d) {
    if (!vr) return;
    if (d > 0 && vr.step < vr.pv.length) {
      animateMove(vr.pv[vr.step]);
      vr.step++;
      vr.maps[vr.step] = boardMap;
    } else if (d < 0 && vr.step > 0) {
      animateUnmove(vr.pv[vr.step - 1], vr.maps[vr.step - 1]);
      vr.step--;
    } else if (d > 0) { exitSub(); return; }
    else return;
    restoreDecor();
    if (vr.evals) setEvalBarCp(vr.evals[vr.step]);
    renderPanel();
  }
  function lineSeek(target) {
    if (!vr) return;
    target = Math.max(0, Math.min(vr.pv.length, target));
    while (vr.step < target) { animateMove(vr.pv[vr.step], true); vr.step++; vr.maps[vr.step] = boardMap; }
    while (vr.step > target) { animateUnmove(vr.pv[vr.step - 1], vr.maps[vr.step - 1]); vr.step--; }
    restoreDecor();
    if (vr.evals) setEvalBarCp(vr.evals[vr.step]);
    renderPanel();
  }
  function exitSub() {
    mode = "game"; vr = null; retry = null;
    clearVar();
    goTo(cursor, "force");
  }

  // ---- retry ("find the better move") --------------------------------------
  function enterRetry() {
    stopPlay();
    const m = momentAt(cursor);
    if (!m) return;
    retry = { ply: cursor, sel: null, done: false, msg: null };
    mode = "retry"; vr = null;
    setBoard(parseFen(m.fen_before));
    restoreDecor();
    renderPanel();
  }
  function retryDots() {
    const spec = retry && retry.sel ? { [retry.sel]: "sel" } : {};
    highlight(spec);
    if (!retry || !retry.sel) return;
    const m = D.moments[retry.ply];
    for (const u of (m.legal || []))
      if (u.slice(0, 2) === retry.sel) {
        const t = u.slice(2, 4);
        sqEls[t].classList.add(boardMap[t] ? "dotc" : "dot");
      }
  }
  function isMyPiece(sq) {
    const pc = boardMap[sq];
    return pc && ((pc === pc.toUpperCase()) === (D.meta.my_color === "white"));
  }
  function onSquareClick(sq) {
    if (mode !== "retry" || !retry || retry.done) return;
    if (sq === retry.sel) { retry.sel = null; retryDots(); return; }  // re-click = deselect
    if (isMyPiece(sq)) { retry.sel = sq; retryDots(); return; }
    if (retry.sel) tryGuess(retry.sel, sq);
  }
  function tryGuess(from, to) {
    const m = D.moments[retry.ply];
    if (from === to) return;
    if (m.legal && m.legal.length &&
        !m.legal.some(u => u.slice(0, 4) === from + to)) {
      retry.sel = null; retryDots(); return;
    }
    if (from + to === m.best_uci.slice(0, 4)) {
      retry.done = true;
      snd.yay();
      animateMove(m.best_uci, true);
      highlight({ [m.best_uci.slice(0,2)]:tintOf("var(--c-best)"), [m.best_uci.slice(2,4)]:tintOf("var(--c-best)") });
      bubble({ ico: CLSDEF.best, head: `${F(m.best_san)} — exactly`,
        body: m.better_plan ? `<b>${m.better_plan}.</b> Now watch the follow-up.` : "Now watch the follow-up.", });
      setTimeout(() => { if (mode === "retry") enterLineFromRetry(m); }, 1500);
    } else {
      retry.sel = null;
      snd.alert();
      document.getElementById("bwrap").classList.add("shake");
      setTimeout(() => document.getElementById("bwrap").classList.remove("shake"), 320);
      retryDots();
      retry.msg = "Legal, but not the coach's move — think about what the position needs.";
      renderPanel();
    }
  }
  let dragState = null;
  piecesHost.addEventListener("pointerdown", (e) => {
    if (mode !== "retry" || !retry || retry.done) return;
    const el = e.target.closest(".pc");
    if (!el) return;
    const sq = Object.keys(pieceEls).find(s => pieceEls[s] === el);
    if (!sq) return;
    if (!isMyPiece(sq)) {
      if (retry.sel) tryGuess(retry.sel, sq);
      return;
    }
    const wasSel = retry.sel === sq;
    retry.sel = sq; retryDots();
    const rect = document.getElementById("bwrap").getBoundingClientRect();
    dragState = { el, sq, rect, moved: false, wasSel };
    el.classList.add("drag");
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  piecesHost.addEventListener("pointermove", (e) => {
    if (!dragState) return;
    dragState.moved = true;
    const { el, rect } = dragState;
    const w = rect.width / 8;
    el.style.transform = `translate(${(e.clientX - rect.left - w/2) / w * 100}%, ` +
                         `${(e.clientY - rect.top - w/2) / w * 100}%)`;
  });
  piecesHost.addEventListener("pointerup", (e) => {
    if (!dragState) return;
    const { el, sq, rect, moved, wasSel } = dragState;
    el.classList.remove("drag");
    dragState = null;
    place(el, sq);
    if (!moved) {                              // plain re-click = deselect
      if (wasSel && retry) { retry.sel = null; retryDots(); }
      return;
    }
    const col = Math.floor((e.clientX - rect.left) / rect.width * 8);
    const row = Math.floor((e.clientY - rect.top) / rect.height * 8);
    if (!(col >= 0 && col <= 7 && row >= 0 && row <= 7)) return;
    const file = orient === "white" ? col : 7 - col;
    const rank = orient === "white" ? 8 - row : row + 1;
    const to = FILES[file] + rank;
    if (to !== sq) tryGuess(sq, to);
  });
  function enterLineFromRetry(m) {
    retry = null;
    const before = parseFen(m.fen_before);
    vr = { ply: cursor, pv: m.pv_uci, sans: m.pv_san.split(" "), evals: m.pv_evals || null,
           notes: m.best_line_notes || [], col: "g", kind: "best",
           step: 1, base: before, maps: [before, boardMap] };
    if (vr.pv.length <= 1) { exitSub(); return; }
    mode = "line";
    if (vr.evals) setEvalBarCp(vr.evals[1]);
    drawArrow(vr.pv[1], "g");
    renderPanel();
  }
  function retryReveal() {
    const m = D.moments[retry.ply];
    retry.done = true;
    drawArrow(m.best_uci, "g");
    bubble({ ico: CLSDEF.best, head: `${F(m.best_san)} was the move`,
      body: m.better_plan ? `<b>${m.better_plan}.</b>` : "" });
    setTimeout(() => {
      animateMove(m.best_uci);
      highlight({ [m.best_uci.slice(0,2)]:tintOf("var(--c-best)"), [m.best_uci.slice(2,4)]:tintOf("var(--c-best)") });
      drawArrow(null);
      setTimeout(() => { if (mode === "retry") enterLineFromRetry(m); }, 1100);
    }, 900);
  }

  // ---- header + wiring ------------------------------------------------------
  (function buildHeader() {
    const m = D.meta;
    const me = `${m.user} (${m.my_rating})`, opp = `${m.opp} (${m.opp_rating})`;
    const left = m.my_color === "white" ? me : opp;
    const right = m.my_color === "white" ? opp : me;
    const rcls = m.outcome === "win" ? "res-win" : m.outcome === "loss" ? "res-loss" : "res-draw";
    document.getElementById("hdr").innerHTML =
      `<h1>${left} <span style="color:var(--faint)">vs</span> ${right}</h1>
       <span class="score ${rcls}">${m.result_str}</span>
       <span class="sub">${m.time_class} ${m.time_control} · ${m.when} ·
       <a href="${m.url}" target="_blank" rel="noopener">chess.com ↗</a> ·
       <span title="Stockfish for the truth, Claude for the why">made with chess-coach</span></span>`;
  })();
  document.getElementById("b-first").onclick = () => { stopPlay(); goTo(0); };
  document.getElementById("b-last").onclick = () => { stopPlay(); goTo(N); };
  document.getElementById("b-prev").onclick = () => { stopPlay(); step(-1); };
  document.getElementById("b-next").onclick = () => step(1);
  document.getElementById("b-play").onclick = () => playing ? stopPlay() : startPlay();
  document.getElementById("b-summary").onclick = () => { stopPlay(); mode = "summary"; vr = null; retry = null; clearVar(); renderPanel(); };
  function openLichess() {
    if (mode === "summary") return;
    window.open("https://lichess.org/analysis/standard/" + currentFen().replace(/ /g, "_"),
                "_blank", "noopener");
  }
  document.getElementById("b-lichess").onclick = openLichess;
  // Space = show the engine's best move here (chess.com analysis convention).
  // Older review JSONs predate D.bests — degrade to the moment's best if any.
  function showBestHere() {
    const m = momentAt(cursor);
    const b = (D.bests || [])[cursor] ||
      (m && { uci: m.best_uci, san: m.best_san });
    if (!b || mode !== "game") return;
    drawArrows([{ uci: b.uci, col: "g" }]);   // no SAN label on the board
    highlight({ [b.uci.slice(0, 2)]: "sel", [b.uci.slice(2, 4)]: "sel" });
  }
  document.addEventListener("keydown", (e) => {
    const t = e.target;                        // typing somewhere? not ours
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    // ←/→ step (the line when one is open — same as the ‹/› buttons), ↑/Home
    // to the start, ↓/End to the final position. preventDefault only where
    // the key actually acts, so the page never scroll-jumps mid-step.
    if (e.key === "ArrowRight") { if (mode !== "retry") { e.preventDefault(); step(1); } }
    else if (e.key === "ArrowLeft") { if (mode !== "retry") { e.preventDefault(); stopPlay(); step(-1); } }
    else if (e.key === "Home" || e.key === "ArrowUp") {
      if (mode !== "summary") { e.preventDefault(); stopPlay(); goTo(0); } }
    else if (e.key === "End" || e.key === "ArrowDown") {
      if (mode !== "summary") { e.preventDefault(); stopPlay(); goTo(N); } }
    else if (e.key === " ") { e.preventDefault(); showBestHere(); }
    else if (e.key === "p" || e.key === "P") { playing ? stopPlay() : startPlay(); }
    else if (e.key === "n" || e.key === "N") { stopPlay(); if (mode === "summary") mode = "game"; nextMoment(); }
    else if (e.key === "l" || e.key === "L") { openLichess(); }
    else if (e.key === "Escape" && mode !== "game" && mode !== "summary") exitSub();
  });

  // hover (desktop) or tap (touch) a move/square in the bubble -> shown on board
  function refDecor(t) {
    if (t.dataset.uci) {
      drawArrow(t.dataset.uci, t.dataset.col || "b");
      highlight({ [t.dataset.uci.slice(0,2)]:"sel", [t.dataset.uci.slice(2,4)]:"sel" });
    } else if (t.dataset.sq) highlight({ [t.dataset.sq]: "key" });
  }
  function wirePanelHovers() {
    const host = document.getElementById("btext");
    host.querySelectorAll("[data-uci],[data-sq]").forEach(t => {
      t.onmouseenter = () => refDecor(t);
      t.onmouseleave = () => restoreDecor();
      t.onclick = (e) => { e.stopPropagation(); refDecor(t); };
    });
  }

  // ---- init -----------------------------------------------------------------
  setBoard(mapAt(0));
  setEvalBar(0);
  renderPanel();
})();
</script>
</body>
</html>
